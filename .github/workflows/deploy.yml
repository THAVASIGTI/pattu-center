name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:       # lets you redeploy by hand from the Actions tab

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Must come before the build: it reports the path this repo is served
      # from, which the build needs baked into every asset URL. For a project
      # site that is "/pattu-center"; for a user site it is empty.
      - name: Resolve Pages base path
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Build static export
        env:
          # Single source of truth: next.config.ts derives basePath from this,
          # and config/content.ts uses it to prefix image paths.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Verify the export
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "::error::no index.html"; exit 1; }
          test -d out/_next      || { echo "::error::no _next/ assets"; exit 1; }
          # Without .nojekyll, Pages runs Jekyll and drops _next/ entirely,
          # taking every stylesheet and script with it.
          test -f out/.nojekyll  || { echo "::error::no .nojekyll"; exit 1; }

          # Assets must carry the base path, or they 404 once deployed.
          if [ -n "$BASE" ] && grep -q 'src="/img/' out/index.html; then
            echo "::error::image paths are missing the $BASE prefix"
            exit 1
          fi

          echo "pages built: $(find out -name '*.html' | wc -l)"
          echo "images:      $(find out/img -type f | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
