name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:       # lets you redeploy by hand from the Actions tab

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: |
          npx tsc --noEmit
          npx eslint .

      - name: Build static export
        env:
          # Project site lives under /<repo>/, so assets need that prefix.
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Confirm the export looks right
        run: |
          test -f out/index.html          || { echo "no index.html"; exit 1; }
          test -f out/.nojekyll           || { echo "no .nojekyll — Jekyll would eat _next/"; exit 1; }
          test -d out/_next               || { echo "no _next/ assets"; exit 1; }
          echo "pages built: $(find out -name '*.html' | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
